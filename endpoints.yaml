# wslc2docker — 端点配置（唯一机器真相源）
#
# 每个 Docker Engine API 端点的「开/关」（enabled）、wslc 对接接口、面板调用、
# 对接方式、微软计划、开发计划都在这里。停止/启用的端点返回 501 Not Implemented。
# 改完此文件后 `sudo systemctl reload wslc2docker`（SIGCHUP）即时生效。

socket: /var/run/docker.sock
tcp: ""                       # 可选，仅本机调试用：127.0.0.1:2375（禁止 0.0.0.0 裸暴露）
wslc_binary: wslc.exe
backend: wslc                 # wslc | fake（fake 用于无 WSLC 环境自测/演示）
log_level: info

endpoints:
  - id: 1
    resource: 系统
    method: GET
    path: /_ping
    wslc: 无需（恒 OK）
    panel: 核心
    bridge: direct
    ms_plan: wslc已可对接
    plan: P0
    enabled: true
    note: ""
  - id: 2
    resource: 系统
    method: HEAD
    path: /_ping
